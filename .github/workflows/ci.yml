name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "**.md"
      - ".claude/**"
      - ".agents/**"
      - ".zed/**"
      - "skills-lock.json"
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  install:
    name: install deps
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      # Version comes from the packageManager field in package.json.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache node_modules
        id: cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

  ci:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: install

    strategy:
      fail-fast: false
      matrix:
        task: [build, test, check-types, lint, format]

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      # The house lint rules are TypeScript, which Node runs from 22.18.
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Restore node_modules
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}

      # The cache can be evicted between the install job and this one.
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Run ${{ matrix.task }}
        run: bun run ${{ matrix.task }}
