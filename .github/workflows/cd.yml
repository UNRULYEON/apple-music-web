name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_checks:
        description: Emergency deploy. Skips the checks.
        type: boolean
        default: false

jobs:
  ci:
    name: ci
    if: ${{ !inputs.skip_checks }}
    uses: ./.github/workflows/ci.yml

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: ci
    if: ${{ !cancelled() && (needs.ci.result == 'success' || inputs.skip_checks) }}

    # Never let two deploys of main overlap.
    concurrency:
      group: deploy-main
      cancel-in-progress: false

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Restore node_modules
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Build and deploy to Cloudflare
        run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
